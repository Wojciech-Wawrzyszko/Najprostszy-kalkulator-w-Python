<!DOCTYPE html>
{% load static %}
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Najprostszy Kalkulator - Wersja 1.10</title>
    <link rel="icon" type="image/png" href="{% static 'kalkulator_app/calculator.png' %}">
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
        }
        .calculator {
            background-color: #f5f5f5;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            margin-top: 20px;
        }
        h1 {
            color: #333;
        }
        input[type="text"] {
            padding: 10px;
            font-size: 18px;
            width: 80%;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ddd;
        }
        button {
            padding: 10px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
            font-size: 16px;
        }
        button:hover {
            background-color: #45a049;
        }
        .result {
            font-size: 24px;
            margin: 20px 0;
            padding: 10px;
            background-color: #e9e9e9;
            border-radius: 5px;
            min-height: 30px;
        }
        .error {
            color: red;
            font-size: 14px;
        }
        .info {
            font-size: 12px;
            margin-top: 20px;
            color: #666;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            margin-top: 10px;
        }
        .equal {
            background-color: #2196F3;
        }
        .equal:hover {
            background-color: #0b7dda;
        }
        .clear {
            background-color: #f44336;
        }
        .clear:hover {
            background-color: #da190b;
        }
        .operation {
            background-color: #ff9800;
        }
        .operation:hover {
            background-color: #e68a00;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <h1>KALKULATOR</h1>
        <p>Wersja: 1.01 Web</p>

        <form method="post" id="calculatorForm">
            {% csrf_token %}
            <input type="text" id="expression" name="wyrazenie" placeholder="Podaj wyrażenie" value="{{ wyrazenie|default:'' }}">

            <div class="buttons">
                <button type="button" onclick="appendToExpression('7')">7</button>
                <button type="button" onclick="appendToExpression('8')">8</button>
                <button type="button" onclick="appendToExpression('9')">9</button>
                <button type="button" class="operation" onclick="appendToExpression('/')">/</button>

                <button type="button" onclick="appendToExpression('4')">4</button>
                <button type="button" onclick="appendToExpression('5')">5</button>
                <button type="button" onclick="appendToExpression('6')">6</button>
                <button type="button" class="operation" onclick="appendToExpression('*')">*</button>

                <button type="button" onclick="appendToExpression('1')">1</button>
                <button type="button" onclick="appendToExpression('2')">2</button>
                <button type="button" onclick="appendToExpression('3')">3</button>
                <button type="button" class="operation" onclick="appendToExpression('-')">-</button>

                <button type="button" onclick="appendToExpression('0')">0</button>
                <button type="button" onclick="appendToExpression('.')">.</button>
                <button type="button" class="clear" onclick="clearExpression()">C</button>
                <button type="button" class="operation" onclick="appendToExpression('+')">+</button>

                <button type="button" onclick="appendToExpression('(')">(</button>
                <button type="button" onclick="appendToExpression(')')">)</button>
                <button type="button" class="operation" onclick="appendToExpression('**')">^</button>
                <button type="button" class="equal" onclick="calculate()">=</button>
            </div>

            <div class="result" id="result">
                {% if wynik != None %}
                    {{ wynik }}
                {% endif %}
            </div>

            {% if blad %}
                <p class="error">{{ blad }}</p>
            {% endif %}
        </form>

        <p class="info">(Wpisz wyrażenie bezpośrednio lub użyj przycisków)</p>
    </div>

    <script>
        function appendToExpression(value) {
            document.getElementById('expression').value += value;
        }

        function clearExpression() {
            document.getElementById('expression').value = '';
            document.getElementById('result').innerHTML = '';
        }

        function calculate() {
            document.getElementById('calculatorForm').submit();
        }
    </script>
</body>
</html>
